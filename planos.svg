78 985 L478 960" stroke="#28484c" stroke-width="2" fill="none"/><text x="500" y="1010" font-size="13" fill="#6b7d7e" text-anchor="middle" font-weight="400">Entrada</text><text x="80" y="1115" font-size="14" fill="#8a6747" text-anchor="start" font-weight="400">Dos ambientes principales: habitación y cocina / comedor.</text><rect x="715" y="665" width="630" height="470" fill="#ffffff" stroke="none" stroke-width="2" rx="20"/><text x="740" y="702" font-size="16" fill="#b77a4c" text-anchor="start" font-weight="700">04</text><text x="785" y="703" font-size="24" fill="#243e42" text-anchor="start" font-weight="600">Apartamento 4</text><text x="740" y="731" font-size="14" fill="#6b7d7e" text-anchor="start" font-weight="400">Parte trasera · Gradas y área de pila</text><rect x="750" y="765" width="165" height="305" fill="#f4ecd9" stroke="none" stroke-width="2" rx="0"/><text x="832.5" y="923.5" font-size="17" fill="#243e42" text-anchor="middle" font-weight="400">Área de pila</text><rect x="915" y="765" width="190" height="305" fill="#e9efe9" stroke="none" stroke-width="2" rx="0"/><text x="1010.0" y="912.0" font-size="17" fill="#243e42" text-anchor="middle" font-weight="400">Cocina /</text><text x="1010.0" y="935.0" font-size="17" fill="#243e42" text-anchor="middle" font-weight="400">comedor</text><rect x="915" y="765" width="115" height="75" fill="#d9eeed" stroke="none" stroke-width="2" rx="0"/><text x="972.5" y="808.5" font-size="17" fill="#243e42" text-anchor="middle" font-weight="400">Baño</text><rect x="1105" y="765" width="195" height="305" fill="#e3ebf5" stroke="none" stroke-width="2" rx="0"/><text x="1202.5" y="923.5" font-size="17" fill="#243e42" text-anchor="middle" font-weight="400">Habitación</text><rect x="750" y="765" width="550" height="305" fill="none" stroke="#28484c" stroke-width="4" rx="0"/><path d="M915 765 L915 1070" stroke="#28484c" stroke-width="4" fill="none"/><path d="M1105 765 L1105 1070" stroke="#28484c" stroke-width="4" fill="none"/><path d="M915 840 L1030 840" stroke="#28484c" stroke-width="4" fill="none"/><path d="M1030 765 L1030 840" stroke="#28484c" stroke-width="4" fill="none"/><path d="M810 1070 L854 1070" stroke="#fff" stroke-width="7" fill="none"/><path d="M810 1070 L810 1045" stroke="#28484c" stroke-width="2" fill="none"/><text x="832" y="1095" font-size="13" fill="#6b7d7e" text-anchor="middle" font-weight="400">Entrada</text><text x="740" y="1115" font-size="14" fill="#8a6747" text-anchor="start" font-weight="400">Puertas interiores y ventanas pendientes de detallar.</text><text x="55" y="1180" font-size="15" fill="#6b7d7e" text-anchor="start" font-weight="400">Los colores identifican usos; no representan acabados reales.</text><text x="55" y="1207" font-size="15" fill="#6b7d7e" text-anchor="start" font-weight="400">Las proporciones son aproximadas. No se incluyen medidas, mobiliario ni aberturas no confirmadas.</text></g></svg>