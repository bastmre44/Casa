<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240"><title>Distribución preliminar de cuatro apartamentos</title><desc>Interpretación de croquis proporcionados por la propietaria. Sin escala; no incluye medidas ni puertas no indicadas.</desc><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1400" height="1240" fill="#f2f4f0" stroke="none" stroke-width="2" rx="0"/><text x="55" y="55" font-size="16" fill="#8a6747" text-anchor="start" font-weight="600">CUATRO APARTAMENTOS · UNA SOLA INVERSIÓN</text><text x="55" y="104" font-size="34" fill="#243e42" text-anchor="start" font-weight="600">Una primera mirada a la distribución</text><text x="55" y="136" font-size="17" fill="#6b7d7e" text-anchor="start" font-weight="400">Basado en tus croquis · Distribución ilustrativa, sin escala · Versión para revisión</text><rect x="55" y="170" width="630" height="470" fill="#ffffff" stroke="none" stroke-width="2" rx="20"/><text x="80" y="207" font-size="16" fill="#b77a4c" text-anchor="start" font-weight="700">01</text><text x="125" y="208" font-size="24" fill="#243e42" text-anchor="start" font-weight="600">Apartamento 1</text><text x="80" y="236" font-size="14" fill="#6b7d7e" text-anchor="start" font-weight="400">Parte frontal · Tipo casa</text><rect x="90" y="270" width="365" height="105" fill="#e9efe9" stroke="none" stroke-width="2" rx="0"/><text x="272.5" y="328.5" font-size="17" fill="#243e42" text-anchor="middle" font-weight="400">Cocina</text><rect x="90" y="270" width="125" height="65" fill="#d9eeed" stroke="none" stroke-width="2" rx="0"/><text x="152.5" y="308.5" font-size="17" fill="#243e42" text-anchor="middle" font-weight="400">Pila</text><path d="M90 335 L215 335" stroke="#78999a" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M215 270 L215 335" stroke="#78999a" stroke-width="2" fill="none" stroke-dasharray="6 5"/><rect x="90" y="375" width="365" height="200" fill="#e9efe9" stroke="none" stroke-width="2" rx